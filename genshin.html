<!DOCTYPE html>
<html lang="por-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Impact</title>

    <style>
    body{
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,0.35),
            rgba(0,0,0,0.85)
        ),
        url("./img/Fundo.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

header{
    background-color: #1e1e1e;
    padding: 20px;
    text-align: center;
    border-bottom: 3px solid #8B5CF6;
}

header h1{
    color: #8B5CF6;
}

header h1{
    color: #8B5CF6;
}

nav{
    text-align: center;
    padding: 15px;
}

nav a{
    color: #C4B5FD;
    text-decoration: none;
    margin: 15px;
    font-weight: bold;
    transition: 0.3s;
}

nav a:hover{
    color: #8B5CF6;
}

#game{
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
    padding: 20px;
}

.card{
    background-color: #222222;
    width: 280px;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    transition: 0.3s;
}

.card:hover{
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
}

.btn-game{ 
    margin-top: 20px;
    background-color: #885cf6;
    color:#1e1e1e;
    padding: 12px 25px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s ease;

}

.btn-game:hover{
    background-color: #1e1e1e;
    color: #8B5CF6;
    box-shadow: 0 0 15px #885cf6;
    transform: translateY(-2px);
}

.card p{
    font-size: 12px;
    color: #8B5CF6;
}

button{
    display:inline-block;
    margin-top:15px;
    padding:12px 30px;
    border:1px solid #8b5cf6;
    border-radius:8px;
    background:transparent;
    color:#8b5cf6;
    text-decoration:none;
    font-weight:bold;
    font-size:12px;
    transition:0.3s;
}

button:hover{
    background-color: #261248;
    color: white;

}

button:visited{
    color: #885cf6
}

.card img{
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 10px;
}

.card h3{
    color: #8B5CF6;
}
    </style>
</head>
<body>
    
<header>
    <h1>⚔️ DreamQuest</h1>
</header>

<nav>
    <a href="./home.html">Início</a>
    <a href="./home.html#Jogos">Jogos</a>
    <a href="./home.html#Ranking">Ranking</a>
    <a href="">Perfil</a>
    <a href="./login.html">Sair</a>
</nav>

<section id="game">

    <div class="card">
    <img src="./img/Genshin Impact.jpeg" alt="Genshin Impact">

    <p>Embarque em uma jornada épica por Teyvat.</p>
    <button>
    <a href="https://youtu.be/QsHWebfAwpY?si=Yi2f3NFxi_H6cdYS" target="_blank" class="">Jogar</a>
    </button>
    </div>

</section>




</body>
</html>
